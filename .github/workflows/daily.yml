name: Daily portfolio refresh

on:
  schedule:
    # GitHub's scheduler is always UTC and does not follow daylight saving, so
    # noon in Chicago is two different UTC times across the year. Both of these
    # fire every day; the "gate" job below works out which one is actually noon
    # locally and skips the other.
    - cron: '0 17 * * *' # 12:00 CDT — roughly Mar–Nov
    - cron: '0 18 * * *' # 12:00 CST — roughly Nov–Mar
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write # to commit the updated history.json
  pages: write
  id-token: write

jobs:
  # Decides whether this particular firing should do the work. Keeps the run to
  # once a day at noon Central year-round, and lets a failed attempt retry on
  # the day's later cron instead of losing the snapshot entirely.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4

      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          now=$(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')
          today=$(TZ=America/Chicago date +%F)
          hour=$(TZ=America/Chicago date +%-H)
          recorded=$(jq -r '.date // ""' data/latest.json 2>/dev/null || echo '')
          echo "Chicago now: $now"
          echo "Last snapshot on file: ${recorded:-none}"

          if [ "$EVENT" != schedule ]; then
            echo "Manual run — proceeding regardless of the clock."
            echo 'go=true' >> "$GITHUB_OUTPUT"
          elif [ "$recorded" = "$today" ]; then
            echo "Today is already recorded — skipping this firing."
            echo 'go=false' >> "$GITHUB_OUTPUT"
          elif [ "$hour" -lt 12 ]; then
            echo "Still before noon in Chicago, so this is the off-season cron — skipping."
            echo 'go=false' >> "$GITHUB_OUTPUT"
          else
            echo "Noon or later in Chicago and nothing recorded today — proceeding."
            echo 'go=true' >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      # continue-on-error: if Plaid is not configured yet (or is briefly down),
      # the page still deploys from the data already committed in data/.
      - name: Pull fresh Vanguard data
        continue-on-error: true
        run: node scripts/fetch.js
        env:
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
          PLAID_ACCESS_TOKEN: ${{ secrets.PLAID_ACCESS_TOKEN }}
          PLAID_ENV: ${{ secrets.PLAID_ENV }}

      - name: Rebuild the dashboard page
        run: node scripts/build.js

      - name: Save the new history point
        run: |
          git config user.name "oa-dashboard-bot"
          git config user.email "oa-dashboard-bot@users.noreply.github.com"
          git add data/history.json data/latest.json
          git diff --cached --quiet || (git commit -m "Daily snapshot $(date -u +%F)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - uses: actions/deploy-pages@v4
